    #gogo-themes * { box-sizing:border-box; }
    #gogo-themes .gg-app, #gogo-themes .gg-app * { font-family:inherit; }
    #gogo-themes .gg-stage { padding:18px 10px; display:flex; justify-content:center; }
    #gogo-themes .gg-app { --gg-bg:#F7F4EE; --gg-surface:#FFFDFA; --gg-soft:#ECE7DE; --gg-ink:#282B29; --gg-muted:#626760; --gg-accent:#3F655B; --gg-on:#FFFFFF; --gg-tint:#E3ECE6; --gg-line:#D8D2C7; --gg-control:#8A8E83; --gg-error:#A33436; width:100%; max-width:390px; color:var(--gg-ink); background:var(--gg-bg); border:1px solid var(--gg-line); border-radius:30px; overflow:hidden; font-size:16px; line-height:1.5; transition:background-color .18s ease,color .18s ease; }
    #gogo-themes .gg-app[data-theme="gelin"] { --gg-bg:#17191B; --gg-surface:#24272A; --gg-soft:#303337; --gg-ink:#F5EEE3; --gg-muted:#BDB6AB; --gg-accent:#D5AD78; --gg-on:#201B15; --gg-tint:#3B3126; --gg-line:#41454A; --gg-control:#8C8F93; --gg-error:#FFB0AD; color-scheme:dark; }
    #gogo-themes button,#gogo-themes textarea { font:inherit; }
    #gogo-themes button { touch-action:manipulation; color:inherit; border:0; background:none; min-height:44px; padding:8px 12px; }
    #gogo-themes button:active { opacity:.72; }
    #gogo-themes button:focus-visible,#gogo-themes textarea:focus-visible { outline:3px solid var(--gg-accent); outline-offset:3px; }
    #gogo-themes [hidden] { display:none !important; }
    #gogo-themes .gg-top { padding:22px 22px 12px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    #gogo-themes .gg-wordmark { font-size:23px; font-weight:700; letter-spacing:-1px; }
    #gogo-themes .gg-subtle { color:var(--gg-muted); font-size:12px; }
    #gogo-themes .gg-theme { margin:0 22px 20px; padding:4px; display:flex; gap:8px; background:var(--gg-soft); border-radius:17px; }
    #gogo-themes .gg-theme button { flex:1; padding:8px 5px; border-radius:13px; font-size:13px; color:var(--gg-muted); display:flex; justify-content:center; align-items:center; gap:7px; }
    #gogo-themes .gg-theme button[aria-pressed="true"] { background:var(--gg-surface); color:var(--gg-ink); box-shadow:0 1px 5px #0000000d; }
    #gogo-themes .gg-theme-mark { display:inline-block; width:12px; height:12px; border-radius:50%; border:1px solid #8A8E83; background:#F2E8D5; flex:none; }
    #gogo-themes .gg-theme-mark.dark { background:#24272A; border-color:#D5AD78; }
    #gogo-themes .gg-intro { padding:0 24px; }
    #gogo-themes .gg-eyebrow { margin:0 0 5px; color:var(--gg-accent); font-size:12px; letter-spacing:2px; }
    #gogo-themes h2 { margin:0; color:var(--gg-ink); font-size:29px; line-height:1.35; font-weight:650; letter-spacing:.5px; }
    #gogo-themes .gg-intro p:last-child { font-size:13px; color:var(--gg-muted); margin:8px 0 0; }
    #gogo-themes .gg-hero { position:relative; margin:18px 18px 0; border-radius:24px; overflow:hidden; background:var(--gg-soft); }
    #gogo-themes .gg-portrait { width:100%; aspect-ratio:1/1; background-image:var(--gg-art); background-size:200% 100%; background-position:left center; }
    #gogo-themes .gg-app[data-theme="gelin"] .gg-hero .gg-portrait { background-position:right center; }
    #gogo-themes .gg-caption { padding:12px 16px; display:flex; justify-content:space-between; gap:8px; align-items:center; background:var(--gg-surface); font-size:13px; }
    #gogo-themes .gg-caption strong { font-weight:600; }
    #gogo-themes .gg-caption span { color:var(--gg-muted); font-size:12px; }
    #gogo-themes .gg-home-body { padding:18px 22px 20px; }
    #gogo-themes .gg-pet-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px; }
    #gogo-themes .gg-pet-row .gg-pet-label { color:var(--gg-muted); font-size:13px; }
    #gogo-themes .gg-pets { display:flex; gap:8px; }
    #gogo-themes .gg-pets button { min-width:62px; border-radius:14px; border:1px solid var(--gg-control); font-size:13px; }
    #gogo-themes .gg-pets button[aria-pressed="true"] { color:var(--gg-on); background:var(--gg-accent); border-color:var(--gg-accent); }
    #gogo-themes .gg-primary { width:100%; display:flex; gap:10px; align-items:center; justify-content:center; min-height:52px; color:var(--gg-on); background:var(--gg-accent); border-radius:17px; font-weight:600; }
    #gogo-themes .gg-primary svg { width:20px; height:20px; }
    #gogo-themes .gg-section-heading { display:flex; justify-content:space-between; align-items:center; margin:22px 0 12px; gap:12px; }
    #gogo-themes .gg-section-heading h3 { margin:0; font-size:16px; font-weight:600; }
    #gogo-themes .gg-section-heading span { font-size:12px; color:var(--gg-muted); }
    #gogo-themes .gg-memory { padding:16px; border-radius:17px; background:var(--gg-surface); border:1px solid var(--gg-line); }
    #gogo-themes .gg-memory small { color:var(--gg-accent); font-size:12px; }
    #gogo-themes .gg-memory p { margin:7px 0 0; font-size:14px; overflow-wrap:anywhere; white-space:pre-wrap; }
    #gogo-themes .gg-nav { display:flex; gap:8px; padding:8px 18px 16px; border-top:1px solid var(--gg-line); background:var(--gg-surface); }
    #gogo-themes .gg-nav button { flex:1; color:var(--gg-muted); display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12px; border-radius:14px; }
    #gogo-themes .gg-nav button[aria-pressed="true"] { color:var(--gg-accent); background:var(--gg-tint); }
    #gogo-themes .gg-nav svg { width:20px; height:20px; }
    #gogo-themes .gg-page { padding:0 22px 24px; min-height:480px; }
    #gogo-themes .gg-page h2 { font-size:25px; margin-bottom:10px; }
    #gogo-themes .gg-page > p { color:var(--gg-muted); font-size:14px; }
    #gogo-themes .gg-timeline { display:grid; gap:12px; margin-top:18px; }
    #gogo-themes .gg-profile-card { margin:18px 0; border:1px solid var(--gg-line); border-radius:18px; padding:16px; background:var(--gg-surface); }
    #gogo-themes .gg-profile-card h3 { font-size:18px; margin:0 0 4px; }
    #gogo-themes .gg-profile-card p { margin:0; font-size:14px; color:var(--gg-muted); }
    #gogo-themes .gg-compose-heading { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:12px; }
    #gogo-themes .gg-compose-heading h2 { margin:0; font-size:22px; }
    #gogo-themes .gg-compose-heading button { color:var(--gg-accent); }
    #gogo-themes .gg-field { display:block; font-size:14px; margin:20px 0 8px; }
    #gogo-themes textarea { width:100%; min-height:170px; resize:vertical; border:1px solid var(--gg-control); border-radius:16px; padding:14px; color:var(--gg-ink); background:var(--gg-surface); font-size:16px; line-height:1.6; }
    #gogo-themes textarea::placeholder { color:var(--gg-muted); }
    #gogo-themes .gg-error { color:var(--gg-error); margin:8px 0 16px; font-size:13px; min-height:20px; }
    #gogo-themes .gg-confirm { padding:14px; margin:12px 0; border:1px solid var(--gg-control); border-radius:14px; background:var(--gg-surface); }
    #gogo-themes .gg-confirm p { margin:0 0 8px; font-size:14px; }
    #gogo-themes .gg-confirm-actions { display:flex; gap:8px; }
    #gogo-themes .gg-confirm button { border:1px solid var(--gg-control); border-radius:10px; }
    #gogo-themes .gg-sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
    @media(max-width:360px) { #gogo-themes .gg-stage { padding:8px 0; } #gogo-themes .gg-top { padding:18px 16px 12px; } #gogo-themes .gg-theme { margin-left:16px; margin-right:16px; } #gogo-themes h2 { font-size:26px; } #gogo-themes .gg-hero { margin-left:12px; margin-right:12px; } }
    @media(prefers-reduced-motion:reduce) { #gogo-themes .gg-app { transition:none; } }
  </style>
  <div class="gg-stage viz-dotted-background">
    <article class="gg-app" data-theme="rouqiu" aria-label="Go狗双主题界面预览">
      <header class="gg-top"><span class="gg-wordmark">Go狗<span style="color:var(--gg-accent)">.</span></span><span class="gg-subtle">两只狗，一起长大</span></header>
      <div class="gg-theme" role="group" aria-label="外观主题，不改变记录对象">
        <button type="button" class="cursor-interaction" data-theme-choice="rouqiu" aria-pressed="true"><span class="gg-theme-mark" aria-hidden="true"></span>肉球 · 奶白</button>
        <button type="button" class="cursor-interaction" data-theme-choice="gelin" aria-pressed="false"><span class="gg-theme-mark dark" aria-hidden="true"></span>格林 · 黑棕</button>
      </div>
      <section data-page="today">
        <div class="gg-intro"><p class="gg-eyebrow">每个小日子，都值得</p><h2>把长大的瞬间，<br>慢慢收藏。</h2><p>从第一次见面，到每一次陪伴。</p></div>
        <figure class="gg-hero">
          <div class="gg-portrait" role="img" aria-label="肉球的参考插画：奶白毛色、立耳与蓬松颈毛"></div>
          <figcaption class="gg-caption"><strong data-theme-name>肉球的奶白日常</strong><span data-theme-detail>软软的，暖暖的</span></figcaption>
        </figure>
        <div class="gg-home-body">
          <div class="gg-pet-row"><span class="gg-pet-label">这次记录谁</span><div class="gg-pets" role="group" aria-label="记录对象"><button type="button" class="cursor-interaction" data-pet="rouqiu" aria-pressed="true">肉球</button><button type="button" class="cursor-interaction" data-pet="gelin" aria-pressed="false">格林</button></div></div>
          <button type="button" class="gg-primary cursor-interaction" data-compose><i data-lucide="plus" aria-hidden="true"></i>记下一件小事</button>
          <div class="gg-section-heading"><h3>最近的小日子</h3><span>示例日记</span></div>
          <div class="gg-memory"><small data-recent-label>肉球 · 日常</small><p data-recent-text>今天也想把你软乎乎的样子记下来。</p></div>
        </div>
      </section>
      <section class="gg-page" data-page="growth" hidden><p class="gg-eyebrow">陪伴慢慢有了形状</p><h2>成长里的小片段</h2><p>肉球和格林，各自的小故事。</p><div class="gg-timeline" data-timeline></div></section>
      <section class="gg-page" data-page="profile" hidden><p class="gg-eyebrow">我们的狗狗</p><h2>两份独一无二</h2><div class="gg-profile-card"><h3>肉球</h3><p>奶白毛色 · 立耳 · 蓬松颈毛</p></div><div class="gg-profile-card"><h3>格林</h3><p>黑棕毛色 · 垂耳 · 棕色眉点</p></div><p>外观可以随心切换，每条记录仍属于你选择的那只狗狗。</p></section>
      <section class="gg-page" data-page="compose" hidden>
        <div class="gg-compose-heading"><h2>记下一件小事</h2><button type="button" class="cursor-interaction" data-cancel>取消</button></div>
        <p>写给 <strong data-compose-pet>肉球</strong></p>
        <form data-form>
          <label class="gg-field" for="gg-diary">今天想留下什么？</label>
          <textarea id="gg-diary" placeholder="一句话，也是一段回忆。" maxlength="500" aria-describedby="gg-error"></textarea>
          <p class="gg-error" id="gg-error" role="alert"></p>
          <button class="gg-primary cursor-interaction" type="button" data-save>保存到预览</button>
        </form>
        <div class="gg-confirm" data-confirm hidden><p>这段文字还没有保存，确定放弃吗？</p><div class="gg-confirm-actions"><button type="button" class="cursor-interaction" data-keep>继续写</button><button type="button" class="cursor-interaction" data-discard>放弃记录</button></div></div>
        <p>当前为界面示例，文字只保留在本次预览中。</p>
      </section>
      <nav class="gg-nav" aria-label="主要页面"><button type="button" class="cursor-interaction" data-nav="today" aria-pressed="true"><i data-lucide="house" aria-hidden="true"></i>今天</button><button type="button" class="cursor-interaction" data-nav="growth" aria-pressed="false"><i data-lucide="book-open" aria-hidden="true"></i>成长</button><button type="button" class="cursor-interaction" data-nav="profile" aria-pressed="false"><i data-lucide="paw-print" aria-hidden="true"></i>档案</button></nav>
      <div class="gg-sr" role="status" aria-live="polite" data-status></div>
    </article>
  </div>
  <script>
  (() => {
    const root = document.getElementById('gogo-themes');
    const app = root.querySelector('.gg-app');
    const field = root.querySelector('#gg-diary');
    const error = root.querySelector('#gg-error');
    const names = {rouqiu:'肉球', gelin:'格林'};
    const records = [
      {pet:'rouqiu',text:'今天也想把你软乎乎的样子记下来。'},
      {pet:'gelin',text:'一抬头，又对上了你亮晶晶的眼睛。'}
    ];
    let theme = 'rouqiu', pet = 'rouqiu', page = 'today', draftPet = 'rouqiu';
    const validPet = value => Object.hasOwn(names,value);
    const announce = text => { root.querySelector('[data-status]').textContent = text; };
    function applyTheme(value) {
      theme = validPet(value) ? value : 'rouqiu';
      app.dataset.theme = theme;
      root.querySelectorAll('[data-theme-choice]').forEach(button => button.setAttribute('aria-pressed',String(button.dataset.themeChoice === theme)));
      root.querySelector('[data-theme-name]').textContent = theme === 'rouqiu' ? '肉球的奶白日常' : '格林的黑棕日常';
      root.querySelector('[data-theme-detail]').textContent = theme === 'rouqiu' ? '软软的，暖暖的' : '眼里亮亮的，心里暖暖的';
      root.querySelector('.gg-portrait').setAttribute('aria-label',theme === 'rouqiu' ? '肉球的参考插画：奶白毛色、立耳与蓬松颈毛' : '格林的参考插画：黑棕毛色、垂耳、棕眉与棕色前爪');
    }
    function selectPet(value) {
      pet = validPet(value) ? value : 'rouqiu';
      root.querySelectorAll('[data-pet]').forEach(button => button.setAttribute('aria-pressed',String(button.dataset.pet === pet)));
      renderRecords();
    }
    function renderRecords() {
      const recent = records.find(record => record.pet === pet);
      root.querySelector('[data-recent-label]').textContent = names[pet] + ' · 日常';
      root.querySelector('[data-recent-text]').textContent = recent.text;
      const timeline = root.querySelector('[data-timeline]');
      timeline.replaceChildren();
      records.forEach(record => {
        const card = document.createElement('article'); card.className = 'gg-memory';
        const label = document.createElement('small'); label.textContent = names[record.pet] + ' · 示例日记';
        const body = document.createElement('p'); body.textContent = record.text;
        card.append(label,body); timeline.append(card);
      });
    }
    function showPage(value) {
      page = value;
      root.querySelectorAll('[data-page]').forEach(section => { section.hidden = section.dataset.page !== page; });
      root.querySelectorAll('[data-nav]').forEach(button => button.setAttribute('aria-pressed',String(button.dataset.nav === page)));
      root.querySelector('.gg-nav').hidden = page === 'compose';
    }
    function remember() {
      if (window.openai && typeof window.openai.setWidgetState === 'function') {
        window.openai.setWidgetState({modelContent:{theme: names[theme]},privateContent:{theme,pet}}).catch(()=>{});
      }
    }
    function restore(state) {
      if (!state || !state.privateContent) return;
      applyTheme(state.privateContent.theme); selectPet(state.privateContent.pet);
    }
    root.querySelectorAll('[data-theme-choice]').forEach(button => button.addEventListener('click',() => {
      applyTheme(button.dataset.themeChoice); remember(); announce('已切换为'+names[theme]+'主题，记录对象仍为'+names[page === 'compose' ? draftPet : pet]);
    }));
    root.querySelectorAll('[data-pet]').forEach(button => button.addEventListener('click',()=>{ selectPet(button.dataset.pet); remember(); announce('记录对象已切换为'+names[pet]); }));
    root.querySelectorAll('[data-nav]').forEach(button => button.addEventListener('click',()=>showPage(button.dataset.nav)));
    root.querySelector('[data-compose]').addEventListener('click',()=>{
      draftPet = pet; root.querySelector('[data-compose-pet]').textContent=names[draftPet];
      field.value=''; error.textContent=''; field.removeAttribute('aria-invalid'); root.querySelector('[data-confirm]').hidden=true;
      showPage('compose'); field.focus();
    });
    root.querySelector('[data-cancel]').addEventListener('click',()=>{
      if (field.value.trim()) { root.querySelector('[data-confirm]').hidden=false; root.querySelector('[data-keep]').focus(); }
      else { showPage('today'); root.querySelector('[data-compose]').focus(); }
    });
    root.querySelector('[data-keep]').addEventListener('click',()=>{root.querySelector('[data-confirm]').hidden=true;field.focus();});
    root.querySelector('[data-discard]').addEventListener('click',()=>{field.value='';root.querySelector('[data-confirm]').hidden=true;showPage('today');root.querySelector('[data-compose]').focus();});
    root.querySelector('[data-save]').addEventListener('click',event=>{
      event.preventDefault(); const text=field.value.trim();
      if (!text) {error.textContent='先写下一句话，再保存这段回忆。';field.setAttribute('aria-invalid','true');field.focus();return;}
      records.unshift({pet:draftPet,text}); field.value='';error.textContent='';field.removeAttribute('aria-invalid');
      renderRecords();showPage('today');announce('已在预览中保存'+names[draftPet]+'的日记');root.querySelector('[data-compose]').focus();
    });
    field.addEventListener('input',()=>{error.textContent='';field.removeAttribute('aria-invalid');});
    applyTheme(theme);selectPet(pet);
    if(window.openai) restore(window.openai.widgetState);
    window.addEventListener('openai:set_globals',event=>restore(event.detail && event.detail.globals && event.detail.globals.widgetState));
  })();
  </script>
</div>
