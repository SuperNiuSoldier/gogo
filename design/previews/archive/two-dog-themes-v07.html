    #gogo-themes * { box-sizing:border-box; }
    #gogo-themes .gg-app, #gogo-themes .gg-app * { font-family:inherit; }
    #gogo-themes .gg-stage { padding:12px 10px; display:flex; justify-content:center; }
    #gogo-themes .gg-app { --gg-bg:#F7F4EE; --gg-surface:#FFFDFA; --gg-soft:#ECE7DE; --gg-ink:#282B29; --gg-muted:#626760; --gg-accent:#3F655B; --gg-on:#FFFFFF; --gg-tint:#E3ECE6; --gg-line:#D8D2C7; --gg-control:#8A8E83; --gg-error:#A33436; width:100%; max-width:390px; color:var(--gg-ink); background:var(--gg-bg); border:1px solid var(--gg-line); border-radius:30px; overflow:hidden; font-size:16px; line-height:1.5; transition:background-color .18s ease,color .18s ease; }
    #gogo-themes .gg-app[data-theme="gelin"] { --gg-bg:#17191B; --gg-surface:#24272A; --gg-soft:#303337; --gg-ink:#F5EEE3; --gg-muted:#BDB6AB; --gg-accent:#D5AD78; --gg-on:#201B15; --gg-tint:#3B3126; --gg-line:#41454A; --gg-control:#8C8F93; --gg-error:#FFB0AD; color-scheme:dark; }
    #gogo-themes button,#gogo-themes textarea { font:inherit; }
    #gogo-themes button { touch-action:manipulation; color:inherit; border:0; background:none; min-height:44px; padding:8px 12px; }
    #gogo-themes button:active { opacity:.72; }
    #gogo-themes button:focus-visible,#gogo-themes textarea:focus-visible { outline:3px solid var(--gg-accent); outline-offset:3px; }
    #gogo-themes [hidden] { display:none !important; }
    #gogo-themes .gg-top { padding:14px 16px 8px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
    #gogo-themes .gg-wordmark { font-size:24px; font-weight:400; letter-spacing:0; }
    #gogo-themes .gg-subtle { color:var(--gg-muted); font-size:12px; }
    #gogo-themes .gg-theme { margin:0 16px 8px; padding:4px; display:flex; gap:8px; background:var(--gg-soft); border-radius:17px; }
    #gogo-themes .gg-theme button { flex:1; padding:8px 5px; border-radius:13px; font-size:13px; color:var(--gg-muted); display:flex; justify-content:center; align-items:center; gap:7px; }
    #gogo-themes .gg-theme button[aria-pressed="true"] { background:var(--gg-surface); color:var(--gg-ink); box-shadow:0 1px 5px #0000000d; }
    #gogo-themes .gg-theme-mark { display:inline-block; width:12px; height:12px; border-radius:50%; border:1px solid #8A8E83; background:#F2E8D5; flex:none; }
    #gogo-themes .gg-theme-mark.dark { background:#24272A; border-color:#D5AD78; }
    #gogo-themes .gg-eyebrow { margin:0 0 6px; color:var(--gg-accent); font-size:12px; letter-spacing:0; }
    #gogo-themes h2 { margin:0; color:var(--gg-ink); font-size:24px; line-height:1.4; font-weight:400; letter-spacing:0; }
    #gogo-themes .gg-hero { position:relative; margin:0 16px; border-radius:20px; overflow:hidden; background:var(--gg-surface); display:grid; grid-template-columns:minmax(0,1fr) minmax(0,50%); align-items:center; }
    #gogo-themes .gg-portrait { width:100%; aspect-ratio:1/1; background-image:var(--gg-art); background-size:200% 100%; background-position:left center; }
    #gogo-themes .gg-app[data-theme="gelin"] .gg-hero .gg-portrait { background-position:right center; }
    #gogo-themes .gg-caption { padding:12px 4px 12px 14px; font-size:13px; }
    #gogo-themes .gg-caption h2 { margin:0 0 6px; font-size:26px; }

    if(!name||[...name].length>16){formError('取一个 1 到 16 字的名字吧。',$('#gg-pet-name'),error);return;}
    if(birthday&&birthday>today){formError('生日不能晚于今天。',$('#gg-pet-birthday'),error);return;}
    if(home&&home>today){formError('到家日期不能晚于今天。',$('#gg-pet-home'),error);return;}
    if(home&&birthday&&home<birthday){formError('到家日期不能早于生日。',$('#gg-pet-home'),error);return;}
    const id=profileDraft.id;profiles[id]={name,birthday,home,note:$('#gg-pet-note').value.trim()};names[id]=name;closeProfile();announce('已经收好'+name+'的小名片。');
  });
  $('[data-pet-cancel]').addEventListener('click',()=>profileSnapshot()!==profileBaseline?simpleConfirm('小名片还没保存，要放弃修改吗？',closeProfile):closeProfile());
  ['#gg-pet-name','#gg-pet-birthday','#gg-pet-home','#gg-pet-note'].forEach(selector=>$(selector).addEventListener('input',()=>{$(selector).removeAttribute('aria-invalid');$('#gg-pet-error').textContent='';}));
  const formatDue=timestamp=>new Date(timestamp).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})+' '+clock(timestamp);
  function openReminders(){remindersReturn=page;render();showPage('reminders');$('[data-add-reminder]').focus();}
  $('[data-profile-reminders]').addEventListener('click',openReminders);$('[data-health-reminders]').addEventListener('click',openReminders);$('[data-home-reminder]').addEventListener('click',openReminders);
  $('[data-reminders-back]').addEventListener('click',()=>{showPage(remindersReturn);const target=page==='health'?$('[data-health-reminders]'):page==='profile'?$('[data-profile-reminders]'):$('[data-home-reminder]');if(!target.hidden)target.focus();else $('[data-more]').focus();});
  function renderReminders(){
    const list=$('[data-reminder-list]');list.replaceChildren();const items=reminders.filter(r=>r.pet===pet).sort((a,b)=>Number(b.active)-Number(a.active)||a.due-b.due);
    if(!items.length){const empty=document.createElement('p');empty.className='gg-empty';empty.textContent='散步、吃饭，或下次驱虫。把想记住的事放在这里。';list.append(empty);return;}
    items.forEach(item=>{
      const card=document.createElement('article');card.className='gg-reminder-card';card.dataset.reminderId=item.id;
      const title=document.createElement('h3');title.textContent=item.title;const when=document.createElement('p');when.textContent=formatDue(item.due)+' · '+{once:'一次',daily:'每天',weekly:'每周'}[item.repeat];
      const status=document.createElement('p');status.textContent=item.active?(item.due<Date.now()?'待完成':names[item.pet]+'的小约定'):'这件事已经做好啦';
      const actions=document.createElement('div');actions.className='gg-reminder-actions';
      const edit=document.createElement('button');edit.type='button';edit.className='cursor-interaction';edit.dataset.reminderEdit=item.id;edit.textContent=item.active?'修改':'重新安排';edit.addEventListener('click',()=>openReminderEditor(item));actions.append(edit);
      if(item.active){const due=item.due,done=document.createElement('button');done.type='button';done.className='cursor-interaction';done.dataset.reminderDone=item.id;done.textContent='完成并记录';done.addEventListener('click',()=>completeReminder(item.id,due));actions.append(done);}
      card.append(title,when,status,actions);list.append(card);
    });
  }
  function openReminderEditor(existing=null){clearDetailForm('reminder-edit');reminderDraft=existing?{...existing}:{pet,title:'',kind:'walk',due:Date.now()+3600000,repeat:'once',active:true};$('[data-reminder-heading]').textContent=existing?'改改小提醒':'添个小提醒';$('#gg-reminder-title').value=reminderDraft.title;$('#gg-reminder-kind').value=reminderDraft.kind;$('#gg-reminder-time').value=localInput(reminderDraft.due);$('#gg-reminder-repeat').value=reminderDraft.repeat;$('#gg-reminder-error').textContent='';$('[data-reminder-delete]').hidden=!existing;reminderBaseline=reminderSnapshot();showPage('reminder-edit');$('#gg-reminder-title').focus();}
  function closeReminderEditor(){reminderDraft=null;clearDetailForm('reminder-edit');render();showPage('reminders');$('[data-add-reminder]').focus();}
  function invalidateReminderUndo(id){if(undo?.reminderPrevious?.id===id){undo=null;$('[data-feedback]').hidden=true;}}
  $('[data-add-reminder]').addEventListener('click',()=>openReminderEditor());
  $('[data-reminder-save]').addEventListener('click',()=>{
    if(!reminderDraft)return;const title=$('#gg-reminder-title').value.trim(),due=new Date($('#gg-reminder-time').value).getTime(),error=$('#gg-reminder-error');
    if(!title){formError('给这件小事起个名字吧。',$('#gg-reminder-title'),error);return;}
    if(!Number.isFinite(due)||due<=Date.now()){formError('选一个接下来的时间吧。',$('#gg-reminder-time'),error);return;}
    const item={...reminderDraft,id:reminderDraft.id||'reminder-'+(++reminderSerial),title,due,kind:$('#gg-reminder-kind').value,repeat:$('#gg-reminder-repeat').value,active:true};
    invalidateReminderUndo(item.id);reminders=reminders.filter(r=>r.id!==item.id);reminders.push(item);closeReminderEditor();announce('提醒已记在本次预览中。');
  });
  $('[data-reminder-cancel]').addEventListener('click',()=>reminderSnapshot()!==reminderBaseline?simpleConfirm('这个提醒还没保存，要放弃修改吗？',closeReminderEditor):closeReminderEditor());
  $('[data-reminder-delete]').addEventListener('click',()=>{if(!reminderDraft?.id)return;const id=reminderDraft.id;simpleConfirm('确定删除这个提醒吗？已经完成的记录会保留。',()=>{invalidateReminderUndo(id);reminders=reminders.filter(r=>r.id!==id);closeReminderEditor();announce('已删除提醒。');});});
  ['#gg-reminder-title','#gg-reminder-kind','#gg-reminder-time','#gg-reminder-repeat'].forEach(selector=>$(selector).addEventListener('input',()=>{$(selector).removeAttribute('aria-invalid');$('#gg-reminder-error').textContent='';}));
  function advanceReminder(item){
    if(item.repeat==='once')item.active=false;
    else{const next=new Date(item.due),days=item.repeat==='daily'?1:7;do{next.setDate(next.getDate()+days);}while(next.getTime()<=Date.now());item.due=next.getTime();}
  }
  function completeReminder(id,due){
    const item=reminders.find(r=>r.id===id&&r.active&&r.due===due),now=performance.now();if(!item)return;
    if(reminderTaps.has(id)&&now-reminderTaps.get(id)<650)return;reminderTaps.set(id,now);
    if(kinds[item.kind].required){openEditor(item.kind);draft.pet=item.pet;draft.reminderRef={id:item.id,due:item.due};$('[data-compose-pet]').textContent=names[item.pet];return;}
    const previous={...item},record={id:makeId(),pet:item.pet,kind:item.kind,time:Date.now(),text:item.title,value:'',sample:false,reminderRef:{id:item.id,due:item.due}};
    records.push(record);advanceReminder(item);render();feedback(record,null,previous);
  }
  $('[data-add-milestone]').addEventListener('click',()=>openEditor('milestone'));

  const hero=$('.gg-hero'),motionQuery=window.matchMedia('(prefers-reduced-motion: reduce)');
  let motionPaused=false,heroVisible=true,petReactionTimer=null;
  function resetHeroReaction(){
    if(petReactionTimer!==null){clearTimeout(petReactionTimer);petReactionTimer=null;}
    delete hero.dataset.petted;$('[data-pet-response]').textContent='点它，摸摸头';
  }
  function syncHeroMotion(){
    const previousMotion=hero.dataset.motion,reduced=motionQuery.matches,running=!reduced&&!motionPaused&&!document.hidden&&page==='today'&&heroVisible;
    hero.dataset.motion=reduced?'reduced':running?'running':'paused';
    const control=$('[data-motion-toggle]'),label=reduced?'已跟随系统减少动态效果':motionPaused?'播放狗狗动态':'暂停狗狗动态';
    control.disabled=reduced;control.setAttribute('aria-label',label);control.setAttribute('data-tooltip',label);
    $('[data-motion-pause]').hidden=motionPaused||reduced;$('[data-motion-play]').hidden=!motionPaused&&!reduced;
    if(!running||previousMotion!==hero.dataset.motion)resetHeroReaction();
  }
  $('[data-motion-toggle]').addEventListener('click',()=>{motionPaused=!motionPaused;syncHeroMotion();remember();announce(motionPaused?'狗狗动态已暂停。':'狗狗动态已开启。');});
  $('.gg-portrait').addEventListener('click',()=>{
    if(petReactionTimer!==null)return;
    if(hero.dataset.motion==='running')hero.dataset.petted='true';
    const response=pet==='rouqiu'?'再摸摸我嘛':'嘿嘿，我在呢';$('[data-pet-response]').textContent=response;announce(names[pet]+'：'+response+'。');
    petReactionTimer=setTimeout(resetHeroReaction,2400);
  });
  motionQuery.addEventListener('change',syncHeroMotion);
  if(typeof IntersectionObserver!=='undefined'){
    const observer=new IntersectionObserver(entries=>{heroVisible=entries[0].isIntersecting;syncHeroMotion();},{threshold:0});observer.observe(hero);
  }

  applyTheme(theme);selectPet(pet);if(window.openai)restore(window.openai.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();syncHeroMotion();});
})();

  

  
</script>
</div>
