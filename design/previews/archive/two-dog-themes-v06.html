    #gogo-themes * { box-sizing:border-box; }
    #gogo-themes .gg-app, #gogo-themes .gg-app * { font-family:inherit; }
    #gogo-themes .gg-stage { padding:12px 10px; display:flex; justify-content:center; }
    #gogo-themes .gg-app { --gg-bg:#F7F4EE; --gg-surface:#FFFDFA; --gg-soft:#ECE7DE; --gg-ink:#282B29; --gg-muted:#626760; --gg-accent:#3F655B; --gg-on:#FFFFFF; --gg-tint:#E3ECE6; --gg-line:#D8D2C7; --gg-control:#8A8E83; --gg-error:#A33436; width:100%; max-width:390px; color:var(--gg-ink); background:var(--gg-bg); border:1px solid var(--gg-line); border-radius:30px; overflow:hidden; font-size:16px; line-height:1.5; transition:background-color .18s ease,color .18s ease; }
    #gogo-themes .gg-app[data-theme="gelin"] { --gg-bg:#17191B; --gg-surface:#24272A; --gg-soft:#303337; --gg-ink:#F5EEE3; --gg-muted:#BDB6AB; --gg-accent:#D5AD78; --gg-on:#201B15; --gg-tint:#3B3126; --gg-line:#41454A; --gg-control:#8C8F93; --gg-error:#FFB0AD; color-scheme:dark; }
    #gogo-themes button,#gogo-themes textarea { font:inherit; }
    #gogo-themes button { touch-action:manipulation; color:inherit; border:0; background:none; min-height:44px; padding:8px 12px; }
    #gogo-themes button:active { opacity:.72; }
    #gogo-themes button:focus-visible,#gogo-themes textarea:focus-visible { outline:3px solid var(--gg-accent); outline-offset:3px; }
    #gogo-themes [hidden] { display:none !important; }
    #gogo-themes .gg-top { padding:14px 16px 8px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
    #gogo-themes .gg-wordmark { font-size:24px; font-weight:400; letter-spacing:0; }
    #gogo-themes .gg-subtle { color:var(--gg-muted); font-size:12px; }
    #gogo-themes .gg-theme { margin:0 16px 8px; padding:4px; display:flex; gap:8px; background:var(--gg-soft); border-radius:17px; }
    #gogo-themes .gg-theme button { flex:1; padding:8px 5px; border-radius:13px; font-size:13px; color:var(--gg-muted); display:flex; justify-content:center; align-items:center; gap:7px; }
    #gogo-themes .gg-theme button[aria-pressed="true"] { background:var(--gg-surface); color:var(--gg-ink); box-shadow:0 1px 5px #0000000d; }
    #gogo-themes .gg-theme-mark { display:inline-block; width:12px; height:12px; border-radius:50%; border:1px solid #8A8E83; background:#F2E8D5; flex:none; }
    #gogo-themes .gg-theme-mark.dark { background:#24272A; border-color:#D5AD78; }
    #gogo-themes .gg-eyebrow { margin:0 0 6px; color:var(--gg-accent); font-size:12px; letter-spacing:0; }
    #gogo-themes h2 { margin:0; color:var(--gg-ink); font-size:24px; line-height:1.4; font-weight:400; letter-spacing:0; }
    #gogo-themes .gg-hero { position:relative; margin:0 16px; border-radius:20px; overflow:hidden; background:var(--gg-surface); display:grid; grid-template-columns:minmax(0,1fr) minmax(0,50%); align-items:center; }
    #gogo-themes .gg-portrait { width:100%; aspect-ratio:1/1; background-image:var(--gg-art); background-size:200% 100%; background-position:left center; }
    #gogo-themes .gg-app[data-theme="gelin"] .gg-hero .gg-portrait { background-position:right center; }
    #gogo-themes .gg-caption { padding:12px 4px 12px 14px; font-size:13px; }
    #gogo-themes .gg-caption h2 { margin:0 0 6px; font-size:26px; }
    #gogo-themes .gg-caption span { display:block; color:var(--gg-muted); font-size:13px; line-height:1.6; }
    #gogo-themes .gg-home-body { padding:10px 16px 14px; }
    #gogo-themes .gg-pet-row { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
    #gogo-themes .gg-pet-row .gg-pet-label { color:var(--gg-muted); font-size:13px; }
    #gogo-themes .gg-pets { display:flex; gap:8px; }
    #gogo-themes .gg-pets button { min-width:62px; border-radius:14px; border:1px solid var(--gg-control); font-size:13px; }
    #gogo-themes .gg-pets button[aria-pressed="true"] { color:var(--gg-on); background:var(--gg-accent); border-color:var(--gg-accent); }
    #gogo-themes .gg-primary { width:100%; display:flex; gap:8px; align-items:center; justify-content:center; min-height:48px; color:var(--gg-on); background:var(--gg-accent); border-radius:16px; font-weight:400; }
    #gogo-themes .gg-primary svg { width:20px; height:20px; }
    #gogo-themes .gg-section-heading { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin:14px 0 8px; gap:8px; }
    #gogo-themes .gg-section-heading h3 { margin:0; font-size:16px; font-weight:400; }
    #gogo-themes .gg-section-heading span { font-size:12px; color:var(--gg-muted); }
    #gogo-themes .gg-memory { padding:12px; border-radius:16px; background:var(--gg-surface); border:1px solid var(--gg-line); }
    #gogo-themes .gg-memory small { color:var(--gg-accent); font-size:12px; }
    #gogo-themes .gg-memory p { margin:6px 0 0; font-size:15px; line-height:1.6; overflow-wrap:anywhere; white-space:pre-wrap; }
    #gogo-themes .gg-nav { display:flex; gap:8px; padding:6px 16px 10px; border-top:1px solid var(--gg-line); background:var(--gg-surface); }
    #gogo-themes .gg-nav button { flex:1; color:var(--gg-muted); display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12px; border-radius:14px; }
    #gogo-themes .gg-nav button[aria-pressed="true"] { color:var(--gg-accent); background:var(--gg-tint); }
    #gogo-themes .gg-nav svg { width:20px; height:20px; }
    #gogo-themes .gg-page { padding:8px 16px 16px; }
    #gogo-themes .gg-page h2 { font-size:22px; margin-bottom:8px; }
    #gogo-themes .gg-page > p { color:var(--gg-muted); font-size:14px; }
    #gogo-themes .gg-timeline { display:grid; gap:8px; margin-top:12px; }
    #gogo-themes .gg-profile-card { margin:12px 0; border:1px solid var(--gg-line); border-radius:16px; padding:12px; background:var(--gg-surface); }
    #gogo-themes .gg-profile-card h3 { font-size:18px; font-weight:400; margin:0 0 4px; }
    #gogo-themes .gg-profile-card p { margin:0; font-size:14px; color:var(--gg-muted); }
    #gogo-themes .gg-compose-heading { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:12px; }
    #gogo-themes .gg-compose-heading h2 { margin:0; font-size:22px; }
    #gogo-themes .gg-compose-heading button { color:var(--gg-accent); }
    #gogo-themes .gg-field { display:block; font-size:14px; margin:20px 0 8px; }
    #gogo-themes textarea { width:100%; min-height:170px; resize:vertical; border:1px solid var(--gg-control); border-radius:16px; padding:14px; color:var(--gg-ink); background:var(--gg-surface); font-size:16px; line-height:1.6; }
    #gogo-themes textarea::placeholder { color:var(--gg-muted); }
    #gogo-themes .gg-error { color:var(--gg-error); margin:8px 0 16px; font-size:13px; min-height:20px; }
    #gogo-themes .gg-confirm { padding:14px; margin:12px 0; border:1px solid var(--gg-control); border-radius:14px; background:var(--gg-surface); }
    #gogo-themes .gg-confirm p { margin:0 0 8px; font-size:14px; }
    #gogo-themes .gg-confirm-actions { display:flex; gap:8px; }

<script>


(() => {
  const root=document.getElementById('gogo-themes');
  const $=selector=>root.querySelector(selector);
  const app=$('.gg-app'),field=$('#gg-diary'),timeField=$('#gg-time'),valueField=$('#gg-value'),error=$('#gg-error');
  const names={rouqiu:'肉球',gelin:'格林'};
  const themeNames={rouqiu:'肉球',gelin:'格林'};
  const kinds={
    feed:{name:'喂食',group:'care',unit:'食量（克，选填）'},water:{name:'喝水',group:'care',unit:'水量（毫升，选填）'},
    pee:{name:'尿尿',group:'care'},poop:{name:'便便',group:'care'},walk:{name:'遛狗',group:'care',unit:'时长（分钟，选填）'},
    diary:{name:'日记',group:'diary',required:'今天想留下什么？'},weight:{name:'称重',group:'health',unit:'体重（千克）',needsValue:true},
    bath:{name:'洗澡',group:'care'},groom:{name:'美容',group:'care'},training:{name:'训练',group:'care'},
    medication:{name:'用药',group:'health',required:'药名与实际用量'},vaccine:{name:'疫苗',group:'health',required:'疫苗名称'},
    deworm:{name:'驱虫',group:'health',required:'驱虫项目或药品名称'},vet:{name:'就诊',group:'health',required:'就诊原因与记录'},
    milestone:{name:'里程碑',group:'diary',required:'值得记住的第一次'},custom:{name:'自定义',group:'care',required:'记录内容'}
  };
  let serial=0;
  const makeId=()=>'record-'+(++serial),now=Date.now();
  let records=[
    {id:makeId(),pet:'rouqiu',kind:'feed',time:now-45*60000,text:'吃完了早餐。',value:'',sample:true},
    {id:makeId(),pet:'rouqiu',kind:'diary',time:now-25*60000,text:'今天也想把你软乎乎的样子记下来。',value:'',sample:true},
    {id:makeId(),pet:'gelin',kind:'diary',time:now-20*60000,text:'一抬头，又对上了你亮晶晶的眼睛。',value:'',sample:true}
  ];
  let theme='rouqiu',pet='rouqiu',page='today',draft=null,baseline='',returnPage='today',moreReturn='today',confirmAction='discard',undo=null;
  const tapTimes=new Map(),validPet=value=>Object.hasOwn(names,value);
  const announce=text=>{$('[data-status]').textContent=text;};
  const clock=value=>new Date(value).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
  const sameDay=value=>new Date(value).toDateString()===new Date().toDateString();
  const localInput=value=>{const d=new Date(value);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);};
  const sorted=list=>[...list].sort((a,b)=>b.time-a.time||Number(b.id.split('-')[1])-Number(a.id.split('-')[1]));
  function applyTheme(value){
    theme=validPet(value)?value:'rouqiu';app.dataset.theme=theme;
    root.querySelectorAll('[data-theme-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeChoice===theme)));
    $('[data-theme-short]').textContent=theme==='rouqiu'?'奶白':'黑棕';
    $('[data-theme-setting]').textContent=themeNames[theme]+(theme==='rouqiu'?' · 奶白':' · 黑棕');
  }
  function selectPet(value){
    pet=validPet(value)?value:'rouqiu';root.querySelectorAll('[data-pet]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pet===pet)));
    $('[data-pet-name]').textContent=names[pet];$('.gg-portrait').dataset.dog=pet;
    render();
  }
  function listInto(target,list,fullDate=false){
    target.replaceChildren();
    if(!list.length){const p=document.createElement('p');p.className='gg-empty';p.textContent='还没有记录，从一次小小的照顾开始。';target.append(p);return;}
    list.forEach(record=>{
      const b=document.createElement('button');b.type='button';b.className='gg-record cursor-interaction';b.dataset.recordId=record.id;b.dataset.kind=record.kind;
      const main=document.createElement('span');main.className='gg-record-main';
      const title=document.createElement('span');title.className='gg-record-title';title.textContent=names[record.pet]+' · '+kinds[record.kind].name;
      const note=document.createElement('span');note.className='gg-record-note';const units={feed:'克',water:'毫升',walk:'分钟',weight:'千克'};
      note.textContent=(record.sample?'示例 · ':'')+(record.value?record.value+' '+units[record.kind]+' · ':'')+(record.text||(record.photo?'留住了一个可爱瞬间。':'已记一次，点开可补充'));
      const time=document.createElement('span');time.className='gg-record-time';time.textContent=(fullDate?new Date(record.time).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})+' ':'')+clock(record.time);
      main.append(title,note);
      if(kinds[record.kind].group==='diary'){
        b.classList.add('gg-album-card');
        if(record.photo){const img=document.createElement('img');img.className='gg-album-photo';img.src=record.photo;img.alt=names[record.pet]+'的'+kinds[record.kind].name+'照片';b.append(img);}
        else if(record.sample){const illustration=document.createElement('span');illustration.className='gg-album-illustration';const art=document.createElement('span');art.className='gg-profile-art';art.dataset.dog=record.pet;art.setAttribute('aria-hidden','true');const caption=document.createElement('span');caption.textContent='示例插画';illustration.append(art,caption);b.append(illustration);}
      }
      b.append(main,time);b.setAttribute('aria-label',title.textContent+'，'+time.textContent+'，'+note.textContent+'，查看或编辑');
      b.addEventListener('click',()=>openEditor(record.kind,record));target.append(b);
    });
  }
  function render(){
    const today=sorted(records.filter(r=>r.pet===pet&&sameDay(r.time)));
    root.querySelectorAll('[data-quick]').forEach(b=>{
      const type=b.dataset.quick,list=today.filter(r=>r.kind===type),last=list[0];
      b.querySelector('.gg-count').textContent='今天 '+list.length+(type==='diary'?' 篇':' 次');b.querySelector('.gg-last').textContent=last?'最近 '+clock(last.time):type==='diary'?'写一句也好':'还没记录';
      const badge=b.querySelector('.gg-count-badge');badge.hidden=!list.length;badge.textContent=list.length>99?'99+':list.length;
      b.setAttribute('aria-label',kinds[type].name+'，'+names[pet]+'今天'+list.length+(type==='diary'?'篇，打开日记编辑':'次，点一下记一次')+(last?'，最近'+clock(last.time):''));
    });
    $('[data-day-summary]').textContent=today.length?'今天留下 '+today.length+' 个小脚印':'从今天的第一件小事开始';
    const stories=sorted(records.filter(r=>r.pet===pet&&kinds[r.kind].group==='diary')),story=stories[0];
    $('[data-story-label]').textContent=story?(story.sample?'示例回忆':'最近的小美好'):'留住一个可爱瞬间';
    $('[data-story-text]').textContent=story?.text||(story?.photo?'留住了一个可爱瞬间。':'一句话，也是一段回忆。');
    const filterPet=$('[data-filter-pet]').value,filterKind=$('[data-filter-kind]').value;
    listInto($('[data-timeline]'),sorted(records.filter(r=>(filterPet==='all'||r.pet===filterPet)&&(filterKind==='all'||kinds[r.kind].group===filterKind))),true);
    $('[data-history-title]').textContent=filterKind==='diary'?'那些小美好':filterKind==='health'?'健康的小足迹':filterKind==='care'?'每天的照顾':'一路的小脚印';
    const health=sorted(records.filter(r=>r.pet===pet&&kinds[r.kind].group==='health')),weight=health.find(r=>r.kind==='weight');
    $('[data-health-pet]').textContent=names[pet];listInto($('[data-health-records]'),health,true);
    const latest=$('[data-health-latest]');latest.replaceChildren();
    if(weight){const label=document.createElement('span');label.textContent='最近一次体重';const value=document.createElement('strong');value.textContent=weight.value+' 千克';const date=document.createElement('span');date.textContent=new Date(weight.time).toLocaleDateString('zh-CN');latest.append(label,value,date);}
    else latest.textContent='还没称过体重？留下第一笔，慢慢看它长大。';
    renderDetails();
  }
  function placeFeedback(){const box=$('[data-feedback]');if(page==='today')$('[data-feedback-slot]').append(box);else $('.gg-nav').before(box);box.hidden=!undo||['edit','pet-edit','reminder-edit'].includes(page);}
  function showPage(value){page=value;root.querySelectorAll('[data-page]').forEach(s=>{s.hidden=s.dataset.page!==value;});root.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.nav===value)));$('.gg-nav').hidden=['edit','more','pet-edit','reminder-edit','reminders'].includes(value);placeFeedback();}
  function feedback(record,previous=null,reminderPrevious=null){undo={id:record.id,previous,reminderPrevious};$('[data-feedback-text]').textContent=names[record.pet]+' · '+kinds[record.kind].name+'，'+clock(record.time)+' 已记录';placeFeedback();}
  function snapshot(){return JSON.stringify([field.value,timeField.value,valueField.value,draft?.photoVersion||0]);}
  function openEditor(kind,existing=null){
    returnPage=page==='edit'?'today':page;draft=existing?{...existing}:{pet:page==='growth'&&validPet($('[data-filter-pet]').value)?$('[data-filter-pet]').value:pet,kind,time:Date.now(),text:'',value:'',sample:false};
    $('[data-edit-title]').textContent=(existing?'编辑':'记录')+kinds[kind].name;$('[data-compose-pet]').textContent=names[draft.pet];
    field.value=draft.text;timeField.value=localInput(draft.time);timeField.max=localInput(Date.now());valueField.value=draft.value;
    $('[data-note-label]').textContent=kinds[kind].required||'备注（选填）';field.placeholder=kind==='diary'?'一句话，也是一段回忆。':'按实际情况填写';
    $('[data-value-wrap]').hidden=!kinds[kind].unit;$('[data-value-label]').textContent=kinds[kind].unit||'';$('[data-delete]').hidden=!existing;

    const profiles={rouqiu:{name:'肉球',birthday:'',home:'',note:'软乎乎的白色小朋友'},gelin:{name:'格林',birthday:'',home:'',note:'眼睛亮亮的黑棕小朋友'}};

  function renderDraftPhoto(){const photo=draft?.photo;$('[data-photo-preview]').hidden=!photo;const img=$('[data-draft-photo]');if(photo)img.src=photo;else img.removeAttribute('src');}
  $('#gg-photo').addEventListener('change',async event=>{
    const file=event.target.files?.[0];if(!file||!draft)return;

    photoLoading=false;$('[data-save]').disabled=false;
    $('#gg-photo-status').textContent='';

  function renderDetails(){

      if(profile.home){const days=Math.floor((calendarDay(Date.now())-calendarDay(new Date(profile.home+'T12:00:00')))/86400000)+1;const joined=document.createElement('p');joined.className='gg-pet-age';joined.textContent='一起生活的第 '+days+' 天';body.append(joined);}

  function renderReminders(){
    const list=$('[data-reminder-list]');list.replaceChildren();const items=reminders.filter(r=>r.pet===pet).sort((a,b)=>Number(b.active)-Number(a.active)||a.due-b.due);

  function openReminderEditor(existing=null){clearDetailForm('reminder-edit');reminderDraft=existing?{...existing}:{pet,title:'',kind:'walk',due:Date.now()+3600000,repeat:'once',active:true};$('[data-reminder-heading]').textContent=existing?'改改小提醒':'添个小提醒';$('#gg-reminder-title').value=reminderDraft.title;$('#gg-reminder-kind').value=reminderDraft.kind;$('#gg-reminder-time').value=localInput(reminderDraft.due);$('#gg-reminder-repeat').value=reminderDraft.repeat;$('#gg-reminder-error').textContent='';$('[data-reminder-delete]').hidden=!existing;reminderBaseline=reminderSnapshot();showPage('reminder-edit');$('#gg-reminder-title').focus();}
