<style>
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}

#gogo-lettering .overlay-host:empty{display:none}
#gogo-lettering .overlay-host{position:absolute;inset:0;z-index:20;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end}
#gogo-lettering .sheet{background:var(--bg);border-radius:28px 28px 0 0;max-height:91%;display:flex;flex-direction:column;box-shadow:0 -6px 24px #0001;animation:gogo-sheet-in 200ms ease-out}
#gogo-lettering .sheet:before{content:"";display:block;align-self:center;width:32px;height:4px;border-radius:4px;background:var(--line);margin-top:10px;flex-shrink:0}
#gogo-lettering .sheet-header{display:flex;align-items:center;justify-content:space-between;padding:5px 15px 10px;gap:8px;flex-shrink:0}
#gogo-lettering .sheet-header h2{font-size:calc(19px * var(--size));text-align:center;flex:1}
#gogo-lettering .sheet-header .quiet-button{min-width:54px;color:var(--accent)}
#gogo-lettering .sheet-content{padding:0 22px 26px;overflow-y:auto;min-height:0;scrollbar-width:thin}
#gogo-lettering .form-field{display:block;margin:0 0 17px;font-size:calc(13px * var(--size));color:var(--muted)}
#gogo-lettering .form-field>span{display:block;margin:0 0 7px}
#gogo-lettering input:not([type=file]),#gogo-lettering textarea,#gogo-lettering select{display:block;width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--control-border);border-radius:12px;padding:12px;font-size:calc(16px * var(--size));min-height:48px}
#gogo-lettering textarea{resize:vertical;min-height:132px;line-height:1.8}
#gogo-lettering .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#gogo-lettering .form-row>*{min-width:0}
#gogo-lettering .form-row input{min-width:0}
#gogo-lettering .error{font-size:calc(13px * var(--size));color:var(--danger);margin:0 0 14px}
#gogo-lettering .quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:2px 0 20px}
#gogo-lettering .quick-action{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:86px;gap:9px;border-radius:18px;background:var(--paper);border:1px solid var(--line);font-size:calc(14px * var(--size))}
#gogo-lettering .quick-action svg{width:25px;height:25px;color:var(--accent)}
#gogo-lettering .quick-bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:11px}
#gogo-lettering .field-photo{display:flex;align-items:center;gap:13px;margin-bottom:18px}
#gogo-lettering .photo-picker-trigger{display:flex;align-items:center;gap:13px;font-size:calc(14px * var(--size));color:var(--muted);text-align:left}
#gogo-lettering .field-photo .photo,#gogo-lettering .add-photo{width:74px;height:74px;border-radius:11px;flex-shrink:0}
#gogo-lettering .add-photo{border:1px dashed var(--muted);display:flex;align-items:center;justify-content:center;color:var(--muted)}
#gogo-lettering .photo-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
#gogo-lettering .photo-options button{padding:4px;border-radius:12px;border:2px solid transparent}
#gogo-lettering .photo-options button[aria-pressed=true]{border-color:var(--accent)}
#gogo-lettering .secondary-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:14px;padding:0 16px;min-height:46px}
#gogo-lettering .full-button{width:100%;margin-top:10px}
#gogo-lettering .danger-button{color:var(--danger)}
#gogo-lettering .detail-photo{margin:0 0 17px;border-radius:14px}
#gogo-lettering .detail-copy{line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0 18px}
#gogo-lettering .detail-meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}
#gogo-lettering .detail-actions{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
#gogo-lettering .viewer{height:100%;background:var(--bg);display:flex;flex-direction:column;animation:gogo-sheet-in 200ms ease-out}
#gogo-lettering .viewer-header{display:flex;align-items:center;justify-content:space-between;padding:16px;gap:5px}
#gogo-lettering .viewer-header small{font-size:calc(13px * var(--size))}
#gogo-lettering .viewer-image{flex:1;display:flex;align-items:center;min-height:0;padding:0 10px}
#gogo-lettering .viewer-image .photo{width:100%;border-radius:18px}
#gogo-lettering .viewer-footer{padding:20px 22px 25px}
#gogo-lettering .viewer-caption{margin-bottom:13px;font-size:calc(17px * var(--size))}
#gogo-lettering .viewer-controls{display:flex;justify-content:space-between;align-items:center}
#gogo-lettering .viewer-steps{display:flex;gap:10px;align-items:center}
#gogo-lettering .toast{position:absolute;bottom:101px;left:24px;right:24px;z-index:40;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:17px;box-shadow:var(--shadow);font-size:calc(14px * var(--size));display:flex;justify-content:space-between;gap:7px;align-items:center;min-height:48px}
#gogo-lettering .toast button{color:inherit;min-width:44px;min-height:44px;text-decoration:underline;text-underline-offset:3px;margin:-8px 0}
#gogo-lettering .export-cover{text-align:center;padding:18px 0 20px}
#gogo-lettering .export-cover .photo{width:80px;margin:0 auto 14px;border-radius:50%}
#gogo-lettering .export-section{border-top:1px solid var(--line);padding:16px 0}
#gogo-lettering .export-section h3{margin-bottom:9px}
#gogo-lettering .export-section .photo{width:90px;float:right;margin:0 0 10px 12px}
#gogo-lettering .export-section p{font-size:calc(14px * var(--size));line-height:1.8}
#gogo-lettering .export-section:after{content:"";display:block;clear:both}
#gogo-lettering .menu-item{width:100%;display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line);text-align:left}
#gogo-lettering .menu-item svg{color:var(--muted)}

#gogo-lettering[data-theme=dark]{--bg:#171b1a;--paper:#242a27;--soft:#303733;--ink:#f4f1e8;--muted:#b5bcb6;--accent:#d7b383;--on-accent:#242119;--line:#e5eee118;--control-border:#7a867c;--danger:#ffaaa0;--glass:#252c26ef;--scrim:#050c0780;--shadow:0 2px 4px #0002,0 12px 24px #0002;color-scheme:dark}
#gogo-lettering *,#gogo-lettering *:before,#gogo-lettering *:after{box-sizing:border-box}
#gogo-lettering *{font-family:inherit}
#gogo-lettering [hidden]{display:none!important}
#gogo-lettering button{font:inherit;color:inherit;border:0;background:none;padding:0;min-width:44px;min-height:44px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;cursor:pointer}
#gogo-lettering button:not(.diary-paper):active{scale:.97}
#gogo-lettering button:disabled{opacity:.4;cursor:default}
#gogo-lettering button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#gogo-lettering h1,#gogo-lettering h2,#gogo-lettering h3,#gogo-lettering p{margin:0;font-weight:400}
#gogo-lettering h1{font-size:calc(29px * var(--size));line-height:1.2;letter-spacing:-.045em}
#gogo-lettering h2{font-size:calc(23px * var(--size));letter-spacing:-.025em}
#gogo-lettering h3{font-size:calc(15px * var(--size))}
#gogo-lettering small,#gogo-lettering .meta{color:var(--muted);font-size:calc(12px * var(--size));line-height:1.5}
#gogo-lettering strong{font-weight:500;font-variant-numeric:tabular-nums}
#gogo-lettering svg.lucide{width:21px;height:21px;stroke-width:1.65;flex-shrink:0}
#gogo-lettering .app-shell{position:relative;isolation:isolate;background:var(--bg);border-radius:36px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 16px 50px #18231e0c}
#gogo-lettering .app-base{height:812px;display:flex;flex-direction:column}
#gogo-lettering .pet-bar{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:18px 20px 5px;flex-shrink:0}
#gogo-lettering .pet-switch{display:flex;align-items:center;gap:5px;padding:3px;background:var(--soft);border-radius:28px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
#gogo-lettering .pet-switch::-webkit-scrollbar{display:none}
#gogo-lettering .pet-switch:empty{background:transparent}
#gogo-lettering .pet-tab{flex-shrink:0}
#gogo-lettering .pet-name{max-width:5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#gogo-lettering .pet-tab{display:flex;align-items:center;gap:7px;min-height:44px;padding:3px 10px 3px 4px;border-radius:22px;color:var(--muted);font-size:calc(13px * var(--size))}
#gogo-lettering .pet-tab[aria-pressed=true]{background:var(--paper);color:var(--ink);box-shadow:0 2px 5px #18221a0d}
#gogo-lettering .pet-tab .photo{width:29px;border-radius:50%}
#gogo-lettering .icon-button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;flex-shrink:0}
#gogo-lettering .theme-button{background:var(--paper);box-shadow:0 0 0 1px var(--line)}
#gogo-lettering .theme-button svg{width:18px;height:18px}
#gogo-lettering .photo.avatar-placeholder{display:grid;place-items:center;background:var(--soft);color:var(--accent);font-size:1em}
#gogo-lettering .profile-photo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
#gogo-lettering .profile-avatar-button{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:calc(14px * var(--size));text-align:left}
#gogo-lettering .profile-avatar-button .pet-avatar{width:72px;border-radius:50%;font-size:28px}
#gogo-lettering .profile-options summary{min-height:44px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:calc(14px * var(--size));cursor:pointer}
#gogo-lettering .profile-options summary:before{content:'+';font-size:20px}
#gogo-lettering .profile-options[open] summary:before{content:'−'}
#gogo-lettering .profile-options[open] summary{margin-bottom:12px}
#gogo-lettering .profile-danger{border-top:1px solid var(--line);margin-top:24px;padding-top:12px}
#gogo-lettering .delete-pet-summary{text-align:center;display:flex;align-items:center;flex-direction:column;gap:10px}
#gogo-lettering .delete-pet-summary .pet-avatar{width:64px;border-radius:50%;font-size:24px}
#gogo-lettering .delete-pet-summary h3{font-size:calc(20px * var(--size))}
#gogo-lettering .delete-pet-summary p,#gogo-lettering .delete-pet-warning{color:var(--muted);font-size:calc(14px * var(--size))}
#gogo-lettering .delete-pet-warning{margin:20px 0;line-height:1.7}
#gogo-lettering .pet-onboarding{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;flex:1;padding:28px;text-align:center}
#gogo-lettering .pet-onboarding>svg{width:48px;height:48px;color:var(--accent)}
#gogo-lettering .pet-onboarding h1{font-size:calc(23px * var(--size))}
#gogo-lettering .app-view{flex:1;min-height:0;position:relative}
#gogo-lettering .page{height:100%;display:flex;flex-direction:column;position:relative}
#gogo-lettering .page-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 23px 17px;min-height:77px;flex-shrink:0}
#gogo-lettering .heading-actions{display:flex;gap:0;align-items:center}
#gogo-lettering .heading-actions .icon-button{width:44px;min-width:44px}

#gogo-lettering .detail-photo{border-radius:20px}
@media(max-width:360px){
  #gogo-lettering .app-base{height:790px}
  #gogo-lettering .pet-bar{padding-left:13px;padding-right:13px}
  #gogo-lettering .page-heading{padding-left:18px;padding-right:14px}
  #gogo-lettering .page-body{padding-left:15px;padding-right:15px}
  #gogo-lettering .album-body{padding-left:12px;padding-right:12px}
  #gogo-lettering .pet-tab{padding-right:8px;gap:5px}
  #gogo-lettering .weight-hero .photo{width:76px}
  #gogo-lettering .weight-hero strong{font-size:calc(43px * var(--size))}
  #gogo-lettering .weight-film{gap:9px}
  #gogo-lettering .weight-film button{flex-basis:51px}
  #gogo-lettering .weight-film .photo{width:51px}
  #gogo-lettering .diary-paper{padding:18px}
  #gogo-lettering .diary-text-photo{gap:12px}
  #gogo-lettering .diary-date strong{font-size:calc(28px * var(--size))}
  #gogo-lettering .calendar-heading .icon-button{min-width:44px;width:44px}
  #gogo-lettering .calendar{margin-left:-10px;margin-right:-10px}
}
@media(prefers-reduced-motion:reduce){#gogo-lettering *,#gogo-lettering *:before,#gogo-lettering *:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(prefers-reduced-transparency:reduce){#gogo-lettering .bottom-nav{background:var(--paper);backdrop-filter:none;-webkit-backdrop-filter:none}}
@media(prefers-contrast:more){#gogo-lettering .bottom-nav{background:var(--paper);box-shadow:0 0 0 1px var(--ink)}#gogo-lettering .diary-paper{box-shadow:0 0 0 1px var(--muted)}}

#gogo-lettering .prints-filter{padding:0 22px 9px;display:flex;justify-content:flex-end;flex-shrink:0}
#gogo-lettering .notebook-symbol{display:grid;place-items:center;width:94px;height:94px;background:var(--soft);color:var(--accent);border-radius:18px}
#gogo-lettering .notebook-line .growth-copy small{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  function bindDiaryScroll(){
    const scroller=view.querySelector('.diary-scroll');if(!scroller)return;

    const events=new AbortController();
    let step=280,height=0,frame=0,settle=0,moving=false;
    function paint(){
      frame=0;const progress=Math.max(0,Math.min(cards.length-1,scroller.scrollTop/step));
      state.card=Math.round(progress);scroller.dataset.current=String(state.card);
      cards.forEach((card,i)=>{
        const delta=i-progress,distance=Math.abs(delta);
        const visible=reduced.matches?i===state.card:distance<1.75;
        // Papers slide straight up/down. Only distance from the reading position
        // changes their clarity; the current paper keeps its original shape and size.
        const mist=reduced.matches?0:Math.max(0,Math.min(1,(distance-.12)/.88));
        const frost=mist*mist*(3-2*mist);
        card.style.transform=`translate(-50%, -50%) translateY(${reduced.matches?0:delta*step}px)`;
        card.querySelector('.diary-content').style.filter=`blur(${frost*4}px)`;

      step=Math.max(220,maxCard+20);

    },{passive:true,signal:events.signal});

      const destinations={ArrowUp:state.card-1,ArrowDown:state.card+1,PageUp:state.card-1,PageDown:state.card+1,Home:0,End:cards.length-1};

    scroller.addEventListener('focusin',event=>{

  }

  function weightChart(list){

  async function readImage(file,maxSize=1600){
    const raw=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});
    const im=new Image();im.src=raw;await im.decode();
    const canvas=document.createElement('canvas'),scale=Math.min(1,maxSize/Math.max(im.width,im.height));
    canvas.width=Math.max(1,Math.round(im.width*scale));canvas.height=Math.max(1,Math.round(im.height*scale));
    canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.88);
  }

  function readVideo(file){
    return new Promise((resolve,reject)=>{
      const url=URL.createObjectURL(file),video=document.createElement('video');let settled=false;
      const abort=()=>finish(new Error('导入已取消'));
      const timer=setTimeout(()=>finish(new Error('视频读取超时')),15000);
      function finish(error,result){
        if(settled)return;settled=true;clearTimeout(timer);lifetime.signal.removeEventListener('abort',abort);
        video.onloadedmetadata=video.onloadeddata=video.onseeked=video.onerror=null;
        video.pause();video.removeAttribute('src');video.load();
        if(error){URL.revokeObjectURL(url);reject(error);}else resolve(result);
      }
      function capture(){
        if(settled||video.seeking||video.readyState<2||!video.videoWidth||!video.videoHeight)return;
        try{
          const canvas=document.createElement('canvas'),scale=Math.min(1,960/Math.max(video.videoWidth,video.videoHeight));
          canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));
          canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
          finish(null,{type:'video',url,poster:canvas.toDataURL('image/jpeg',.85),duration:Number.isFinite(video.duration)?video.duration:0,width:video.videoWidth,height:video.videoHeight});
        }catch{finish(new Error('视频封面无法读取'));}
      }
      lifetime.signal.addEventListener('abort',abort,{once:true});
      video.preload='auto';video.muted=true;video.playsInline=true;
      video.onloadedmetadata=()=>{if(!video.videoWidth||!video.videoHeight){finish(new Error('视频无法读取'));return;}try{video.currentTime=Math.min(.15,Number.isFinite(video.duration)?video.duration/2:.15);}catch{capture();}};
      video.onloadeddata=capture;video.onseeked=capture;video.onerror=()=>finish(new Error('当前浏览器无法读取该视频'));
      if(lifetime.signal.aborted){abort();return;}
      video.src=url;video.load();
    });
  }
  async function importFiles(files,context){
    if(!files.length||!context||!pets[context.pet])return;
    const selected=[...files],limit=context.forEditor||context.source==='camera'?1:20;
    const imported=[];let failures=Math.max(0,selected.length-limit),reason=failures?'每批最多 20 项':'';
    toast('正在导入…');
    for(const file of selected.slice(0,limit)){
      if(disposed||!pets[context.pet])break;
      const isVideo=file.type.startsWith('video/')||(!file.type&&/\.(mp4|mov|m4v|webm)$/i.test(file.name));
      const isImage=file.type.startsWith('image/')||(!file.type&&/\.(jpe?g|png|webp|heic|heif)$/i.test(file.name));
      if((isVideo&&!context.allowVideo)||(!isVideo&&!isImage)){failures++;reason='文件类型不支持';continue;}
      if(file.size>(isVideo?200:20)*1024*1024){failures++;reason=isVideo?'单段视频最多 200 MB':'单张照片最多 20 MB';continue;}
      try{
        let media;
        if(isVideo)media=await readVideo(file);
        else media={type:'image',url:await readImage(file)};
        imported.push({id:uid(),pet:context.pet,date:today,caption:'',source:context.source,...media});
      }catch(error){failures++;reason=isVideo?(error.message||'视频无法读取'):'照片无法读取';}
    }
    if(disposed||!pets[context.pet]){imported.filter(p=>p.type==='video').forEach(p=>URL.revokeObjectURL(p.url));return;}
    if(context.forEditor&&editor!==context.editorRef){imported.filter(p=>p.type==='video').forEach(p=>URL.revokeObjectURL(p.url));toast('已取消这次导入');return;}
    if(imported.length){
      imported.filter(p=>p.type==='video').forEach(p=>mediaUrls.add(p.url));
      data.photos.unshift(...imported);
      if(context.source==='album'&&!context.forEditor)for(const p of imported)data.entries.unshift({id:uid(),pet:p.pet,kind:'diary',date:p.date,time:nowTime(),text:'',photoId:p.id});
      if(context.source==='camera')for(const p of imported)data.entries.unshift({id:uid(),pet:p.pet,kind:'diary',date:p.date,time:nowTime(),text:'',photoId:p.id});
      if(context.forEditor&&editor&&editor===context.editorRef){editor.photoId=imported[0].id;editor.dirty=true;renderEditor();}
      else if(state.pet===context.pet&&!modal){state.tab='prints';state.prints='diary';state.card=0;render();savePrefs();viewer(imported[0].id);}
      const videoCount=imported.filter(p=>p.type==='video').length,imageCount=imported.length-videoCount;
      toast(`已添加 ${[imageCount?imageCount+' 张照片':'',videoCount?videoCount+' 段视频':''].filter(Boolean).join('、')}${failures?`；${failures} 项未导入，${reason}`:''}`);
    }else toast(reason||'文件无法读取，请换一个文件再试');
  }

  root.querySelectorAll('.media-input,.camera-input').forEach(input=>input.addEventListener('change',()=>{const context=importContext;importContext=null;importFiles(input.files,context);}));
  root.querySelector('.avatar-input').addEventListener('change',event=>{const target=avatarContext;avatarContext=null;importAvatar(event.target.files[0],target);});
  overlay.addEventListener('click',event=>{if(event.target===overlay)requestClose();});
  overlay.addEventListener('keydown',event=>{
    if(event.key==='Enter'&&event.target.tagName==='INPUT'&&modal==='editor'){event.preventDefault();submitEditor();return;}
    if(event.key==='Escape'){event.preventDefault();if(modal==='discard-confirm')resumeEditor();else if(modal==='photo-picker')renderEditor();else requestClose();}
    if(event.key==='Tab'){const focusable=[...overlay.querySelectorAll('button:not([disabled]),input,select,textarea,summary,video[controls]')].filter(e=>e.getClientRects().length&&!e.closest('details:not([open]) :not(summary)'));const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}
  });
  overlay.addEventListener('error',event=>{if(event.target.tagName==='VIDEO'){const error=event.target.parentElement.querySelector('.media-error');if(error)error.hidden=false;}},true);
  overlay.addEventListener('play',event=>{if(event.target.tagName==='VIDEO'){stopPlay();updatePlayButton();}},true);
  overlay.addEventListener('focusin',event=>{if(modal==='viewer'&&playTimer&&event.isTrusted&&event.target.dataset.action!=='toggle-play'){stopPlay();updatePlayButton();}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseVideos();stopPlay();updatePlayButton();}},{signal:lifetime.signal});
  reduced.addEventListener('change',()=>{if(reduced.matches){stopPlay();updatePlayButton();}},{signal:lifetime.signal});
  function bindAlbum(){
    const rail=root.querySelector('.album-rail');if(!rail)return;
    const events=new AbortController();
    rail.scrollLeft=albumIndex*rail.clientWidth;
    rail.addEventListener('scroll',()=>{
      albumIndex=Math.round(rail.scrollLeft/rail.clientWidth);
      root.querySelectorAll('[data-action="album-jump"]').forEach((el,i)=>el.setAttribute('aria-pressed',String(i===albumIndex)));
      const count=root.querySelector('.album-position');if(count)count.textContent=`${albumIndex+1} / ${photos().length}`;

    },{passive:true,signal:events.signal});
    pageCleanup=()=>{events.abort();pageCleanup=()=>{};};
  }
  render();
  document.fonts?.ready.then(()=>{if(!disposed)revealPet();});
  if(shared.draft&&(shared.draft.kind==='profile'&&!shared.draft.id||pets[shared.draft.pet])){editor={...shared.draft};renderEditor();}
  return {
    snapshot(){shared.viewState={...state};shared.draft=editor?{...editor,avatarLoading:false}:null;shared.data=data;shared.preferences={pet:state.pet,theme:state.theme,tab:state.tab};},
    configure(key,value){
      design[key]=value;
      if(key==='content'){
        close();mediaUrls.forEach(url=>URL.revokeObjectURL(url));mediaUrls.clear();data=seed();state.card=0;albumIndex=0;
        if(value!=='full')for(const k of Object.keys(data))data[k]=value==='empty'?[]:Object.keys(pets).flatMap(p=>data[k].filter(x=>x.pet===p).slice(0,1));
        shared.data=data;
      }
      render();
    },
    destroy(){disposed=true;pauseVideos();lifetime.abort();disposeDiary();pageCleanup();stopPlay();clearTimeout(toastTimer);}
  };
}

(() => {
  const root=document.getElementById('gogo-lettering-exploration');
  const stage=root.querySelector('#stage');
  const template=document.getElementById('gogo-lettering-template');
  const picker=root.querySelector('.proto-picker');
  const highlight=picker.querySelector('.proto-picker-highlight');
  const items=[...picker.querySelectorAll('.proto-picker-item')];
  const saved=window.openai?.widgetState?.privateContent||{};
  const prefs=saved.surface==='lettering'?saved:{tab:'reminders'};
  const shared={preferences:{tab:'reminders',...prefs},design:{content:'full',textSize:'standard'}};
  let current=0,app=null,mountFrame=0;
  function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`;}
  function mount(i){
    cancelAnimationFrame(mountFrame);app?.snapshot();app?.destroy();app=null;stage.innerHTML='';
    mountFrame=requestAnimationFrame(()=>{stage.innerHTML=template.innerHTML;app=startGoDog(document.getElementById('gogo-lettering'),letteringDirections[i],shared);});
  }
  function setActive(i,persist=true){
    if(i<0||i>=letteringDirections.length)return;
    current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current');});
    moveHighlight();try{const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);}catch{}
    mount(i);
    if(persist)window.openai?.setWidgetState?.({modelContent:{surface:'提醒页字体与图标对照',variant:letteringDirections[i].name},privateContent:{...shared.preferences,surface:'lettering',variant:letteringDirections[i].lettering}})?.catch(()=>{});
  }
  items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
  window.addEventListener('resize',moveHighlight);
  document.addEventListener('keydown',e=>{
    if(e.defaultPrevented||/^(INPUT|TEXTAREA|SELECT|VIDEO)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;
    const n=parseInt(e.key,10);
    if(n>=1&&n<=items.length)setActive(n-1);
    else if(e.key==='ArrowRight')setActive((current+1)%items.length);
    else if(e.key==='ArrowLeft')setActive((current-1+items.length)%items.length);
    else if(e.key.toLowerCase()==='r')mount(current);
  });
  const urlIndex=parseInt(new URLSearchParams(location.search).get('v'),10)-1;
  const hostIndex=letteringDirections.findIndex(d=>d.lettering===prefs.variant);
  setActive(Number.isInteger(urlIndex)&&urlIndex>=0&&urlIndex<items.length?urlIndex:Math.max(0,hostIndex),false);
  requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  window.addEventListener('openai:set_globals',event=>{
    const next=event.detail?.globals?.widgetState?.privateContent;if(next?.surface!=='lettering')return;
    const i=letteringDirections.findIndex(d=>d.lettering===next.variant);if(i>=0&&i!==current){shared.preferences={...shared.preferences,...next};setActive(i,false);}
  });
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root,onChange:()=>app?.configure('textSize',shared.design.textSize)});
    tweak.addSelect(shared.design,'textSize',{label:'文字大小',options:[{label:'常规',value:'standard'},{label:'放大',value:'large'}]});
  }
})();

})();
</script>
