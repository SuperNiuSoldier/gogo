<div class="viz-dotted-background" style="padding:12px 0">
  <div id="gogo-life" aria-label="Go狗四页原型" data-theme="light">
    <div class="app-shell">
      <div class="app-base">
        <header class="pet-bar">
          <div class="pet-switch" aria-label="当前狗狗"></div>
          <button class="icon-button theme-button" data-action="theme" aria-label="切换到黑棕主题"><i data-lucide="moon" aria-hidden="true"></i></button>
        </header>
        <main class="app-view"></main>
        <nav class="bottom-nav" aria-label="主导航"></nav>
      </div>
      <div class="overlay-host"></div>
      <div class="toast" role="status" aria-live="polite" hidden></div>
      <input class="media-input" type="file" accept="image/*" multiple hidden aria-label="从相册选择照片">
      <input class="camera-input" type="file" accept="image/*" capture="environment" hidden aria-label="拍照留个瞬间">
    </div>
  </div>
</div>
